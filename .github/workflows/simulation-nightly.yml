name: Headless Simulation Nightly

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      runs:
        description: Number of simulated games
        required: false
        default: '50'
      turns:
        description: Target completed turns per game
        required: false
        default: '100'

concurrency:
  group: headless-simulation-nightly
  cancel-in-progress: true

jobs:
  balance-matrix:
    name: Multi-seed balance matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 03_Web_Rebuild

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Web_Rebuild/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check simulation harness
        run: npm run typecheck

      - name: Run multi-seed balance matrix
        env:
          SIM_BALANCE: '1'
          SIM_RUNS: ${{ inputs.runs || '50' }}
          SIM_TURNS: ${{ inputs.turns || '100' }}
        run: npm run test:simulation:balance
