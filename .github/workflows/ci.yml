name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Web_Rebuild

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 03_Web_Rebuild/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ../typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: ESLint
        run: npm run lint

      - name: Headless simulation smoke gate
        run: npm run test:simulation:smoke

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Build for production
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 03_Web_Rebuild/playwright-report/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: 03_Web_Rebuild/coverage/
          retention-days: 7
