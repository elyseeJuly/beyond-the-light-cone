name: Manual Deep Simulation

on:
  workflow_dispatch:
    inputs:
      runs:
        description: Number of balance simulations
        required: false
        default: '50'
      turns:
        description: Target turns for balance simulations
        required: false
        default: '100'
      reachability_runs:
        description: Number of reachability simulations
        required: false
        default: '40'
      reachability_turns:
        description: Target turns for reachability simulations
        required: false
        default: '250'
      soak_runs:
        description: Number of long-horizon simulations
        required: false
        default: '8'
      soak_turns:
        description: Target turns for each soak simulation
        required: false
        default: '500'

concurrency:
  group: manual-deep-simulation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulation-audit:
    name: Balance, reachability and soak audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: 03_Web_Rebuild

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Web_Rebuild/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check simulation harness
        run: npm run typecheck

      - name: Lint simulation harness
        run: npm run lint:simulation

      - name: Run multi-seed balance matrix
        env:
          SIM_BALANCE: '1'
          SIM_RUNS: ${{ inputs.runs || '50' }}
          SIM_TURNS: ${{ inputs.turns || '100' }}
        run: npm run test:simulation:balance

      - name: Run reachability matrix
        env:
          SIM_REACHABILITY: '1'
          SIM_REACHABILITY_RUNS: ${{ inputs.reachability_runs || '40' }}
          SIM_REACHABILITY_TURNS: ${{ inputs.reachability_turns || '250' }}
        run: npm run test:simulation:reachability

      - name: Run long-horizon soak matrix
        env:
          SIM_SOAK: '1'
          SIM_SOAK_RUNS: ${{ inputs.soak_runs || '8' }}
          SIM_SOAK_TURNS: ${{ inputs.soak_turns || '500' }}
        run: npm run test:simulation:soak

      - name: Upload simulation audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-audit-reports
          path: 03_Web_Rebuild/reports/simulation/
          if-no-files-found: warn
          retention-days: 30
