name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Web_Rebuild

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 03_Web_Rebuild/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee ../typecheck.log

      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

      - name: ESLint full project
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee ../eslint.log

      - name: Upload ESLint diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-diagnostics
          path: eslint.log
          retention-days: 7

      - name: Headless simulation smoke gate
        run: |
          set -o pipefail
          npm run test:simulation:smoke 2>&1 | tee ../simulation-smoke.log

      - name: Quick reachability and soak report gate
        if: github.event_name == 'pull_request'
        env:
          SIM_REACHABILITY: '1'
          SIM_REACHABILITY_RUNS: '4'
          SIM_REACHABILITY_TURNS: '40'
          SIM_SOAK: '1'
          SIM_SOAK_RUNS: '2'
          SIM_SOAK_TURNS: '60'
        run: |
          npm run test:simulation:reachability
          npm run test:simulation:soak

      - name: Upload simulation smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-smoke-diagnostics
          path: simulation-smoke.log
          retention-days: 7

      - name: Upload quick simulation reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: simulation-quick-reports
          path: 03_Web_Rebuild/reports/simulation/
          if-no-files-found: warn
          retention-days: 7

      - name: Run test suite with coverage
        run: npm run test:coverage

      - name: Build for production
        run: npm run build

      - name: Verify PWA release bundle
        run: npm run verify:pwa-release

      - name: Install Chromium for pull request E2E
        if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run Chromium E2E gate for pull request
        if: github.event_name == 'pull_request'
        run: npx playwright test --project=chromium-desktop

      - name: Install full Playwright browser matrix on main
        if: github.event_name == 'push'
        run: npx playwright install --with-deps

      - name: Run full Playwright E2E matrix on main
        if: github.event_name == 'push'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 03_Web_Rebuild/playwright-report/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: 03_Web_Rebuild/coverage/
          retention-days: 7
