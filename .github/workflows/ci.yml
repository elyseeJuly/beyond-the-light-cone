name: Lightweight PR Gate

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Type Check, Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Web_Rebuild

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Web_Rebuild/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run fast hotfix verification
        run: |
          set -o pipefail
          npm run verify:fast 2>&1 | tee ../verify-fast.log

      - name: Upload fast-check diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-fast-check-diagnostics
          path: verify-fast.log
          if-no-files-found: ignore
          retention-days: 3
